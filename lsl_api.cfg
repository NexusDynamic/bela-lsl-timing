; liblsl configuration for the Bela timing rig.
; Docs: https://labstreaminglayer.readthedocs.io/info/lslapicfg.html

[ports]
; The Bela has no usable IPv6 route; leaving it on wastes resolve attempts.
IPv6 = disable

[lab]
; STRONGLY RECOMMENDED for timing runs: list the iPad IPs here. Naming the
; peers makes stream resolution deterministic and skips multicast discovery
; entirely, so there is less background traffic competing with the very packets
; whose latency is being measured.
;
; Uncomment and fill in before a session:
; KnownPeers = {192.168.1.10, 192.168.1.11}

[tuning]
; Leave the defaults. In particular do NOT enable any inlet post-processing
; here: render.cpp requests post_none explicitly and logs the time-correction
; series separately, so the timestamps in the data stay raw and auditable.
